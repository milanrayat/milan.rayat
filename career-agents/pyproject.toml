[project]
name = "career-agents"
version = "0.1.0"
description = "Nightly Job Scout + People Scout agents writing to a Google Sheet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "gspread>=6.1",
    "google-auth>=2.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.47",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "lingua-language-detector>=2.0",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "network: needs live network (excluded from make test)",
]

[tool.uv]
package = false
